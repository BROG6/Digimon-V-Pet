name: Auto-Build Native Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🏷️ Auto-Bump Version & Prepare Release
        id: prep_release
        run: node scripts/ci-prepare-release.mjs

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build production web assets
        run: npm run build

      - name: ☕ Set up Java (JDK 21)
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Set up Gradle
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        uses: gradle/actions/setup-gradle@v3

      - name: 🔌 Sync Capacitor Android platform
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        run: |
          npx cap sync android || ./node_modules/.bin/cap sync android || true

      - name: 🛡️ Ensure Overlay & Network Permissions in AndroidManifest
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "SYSTEM_ALERT_WINDOW" "$MANIFEST"; then
              echo "Injecting SYSTEM_ALERT_WINDOW into AndroidManifest..."
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"
            fi
          fi

      - name: 🔐 Verify Persistent APK Signing Keystore
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        run: |
          test -f android/app/digipet-debug.keystore
          keytool -list -v -storetype PKCS12 -keystore android/app/digipet-debug.keystore -storepass android | grep -E "Alias name:|SHA256:"

      - name: ⚙️ Compile Signed Release APK with Gradle
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            echo "gradlew wrapper missing, building with system gradle..."
            gradle assembleRelease --stacktrace
          fi

      - name: 📤 Upload Downloadable APK Artifact
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DigiPet-Native-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 📦 Prepare Release APK Filenames
        if: steps.prep_release.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.prep_release.outputs.version }}"
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/digipet-latest.apk
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/digipet-v${VERSION}.apk"

      - name: 🚀 Publish GitHub Release with APK Assets
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.prep_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/digipet-latest.apk
            android/app/build/outputs/apk/release/digipet-v*.apk
          tag_name: ${{ steps.prep_release.outputs.tag }}
          name: DigiPet ${{ steps.prep_release.outputs.tag }}
          body: |
            ## 🎮 DigiPet Companion ${{ steps.prep_release.outputs.tag }} (Build ${{ steps.prep_release.outputs.version_code }})

            ### ✨ What's New:
            ${{ steps.prep_release.outputs.notes }}

            ### 📲 How to Install:
            1. Download `digipet-latest.apk` below on your Android phone.
            2. Open the downloaded file to install or update without losing your pet progress!
          draft: false
          prerelease: false
          make_latest: true
