name: Auto-Build Native Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🏷️ Auto-Bump Version & Prepare Release
        id: prep_release
        run: node scripts/ci-prepare-release.mjs

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build production web assets
        run: npm run build

      - name: ☕ Set up Java (JDK 21)
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Set up Gradle
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        uses: gradle/actions/setup-gradle@v3

      - name: 🔌 Sync Capacitor Android platform
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        run: |
          npx cap sync android || ./node_modules/.bin/cap sync android || true

      - name: 🛡️ Ensure Required Permissions in AndroidManifest
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            grep -q "SYSTEM_ALERT_WINDOW" "$MANIFEST" || { echo "Missing SYSTEM_ALERT_WINDOW"; exit 1; }
            grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST" || { echo "Missing REQUEST_INSTALL_PACKAGES"; exit 1; }
            if grep -q "DOWNLOAD_WITHOUT_NOTIFICATION" "$MANIFEST"; then
              echo "Security check failed: DOWNLOAD_WITHOUT_NOTIFICATION must not be present."
              exit 1
            fi
          fi

      - name: 🔐 Decode Private Release Keystore from GitHub Secrets
        id: decode_keystore
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing private release keystore GitHub Secrets!"
            echo "Add these 4 repository secrets under Settings -> Secrets and variables -> Actions:"
            echo "  1. ANDROID_KEYSTORE_BASE64  (base64 -w0 digipet-release.p12)"
            echo "  2. ANDROID_KEYSTORE_PASSWORD"
            echo "  3. ANDROID_KEY_ALIAS"
            echo "  4. ANDROID_KEY_PASSWORD"
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/digipet-release.keystore"
          echo "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" | grep -E "Alias name:|Signature algorithm name:|SHA256:" || true
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Compile Signed Release APK with Gradle
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        working-directory: android
        env:
          DIGIPET_RELEASE_KEYSTORE: ${{ steps.decode_keystore.outputs.keystore_path }}
          DIGIPET_KEYSTORE_TYPE: PKCS12
          DIGIPET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DIGIPET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DIGIPET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace
          else
            echo "gradlew wrapper missing, building with system gradle..."
            gradle assembleRelease --stacktrace
          fi
          test -f app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          fi

      - name: 🧹 Shred Temporary Keystore File
        if: always() && steps.decode_keystore.outputs.keystore_path != ''
        run: |
          rm -f "${{ steps.decode_keystore.outputs.keystore_path }}"

      - name: 📤 Upload Downloadable APK Artifact
        if: steps.prep_release.outputs.should_release == 'true' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DigiPet-Native-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 📦 Prepare Release APK Filenames
        if: steps.prep_release.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.prep_release.outputs.version }}"
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/digipet-latest.apk
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/digipet-v${VERSION}.apk"

      - name: 🚀 Publish GitHub Release with APK Assets
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.prep_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/digipet-latest.apk
            android/app/build/outputs/apk/release/digipet-v*.apk
          tag_name: ${{ steps.prep_release.outputs.tag }}
          name: DigiPet ${{ steps.prep_release.outputs.tag }}
          body: |
            ## 🎮 DigiPet Companion ${{ steps.prep_release.outputs.tag }} (Build ${{ steps.prep_release.outputs.version_code }})

            ### ✨ What's New:
            ${{ steps.prep_release.outputs.notes }}

            ### 📲 How to Install:
            1. Download `digipet-latest.apk` below on your Android phone.
            2. Open the downloaded file to install or update without losing your pet progress!
          draft: false
          prerelease: false
          make_latest: true
