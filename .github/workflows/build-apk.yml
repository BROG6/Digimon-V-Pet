name: Auto-Build Native Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build production web assets
        run: npm run build

      - name: ☕ Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔌 Sync Capacitor Android platform
        run: |
          npx cap sync android || ./node_modules/.bin/cap sync android || true

      - name: 🛡️ Ensure Overlay & Network Permissions in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "SYSTEM_ALERT_WINDOW" "$MANIFEST"; then
              echo "Injecting SYSTEM_ALERT_WINDOW into AndroidManifest..."
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"
            fi
          fi

      - name: ⚙️ Compile Debug APK with Gradle
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew wrapper missing, building with system gradle..."
            gradle assembleDebug --stacktrace
          fi

      - name: 📤 Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiPet-Native-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🏷️ Extract Version and Prepare Release Artifacts
        id: prep_release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/digipet-latest.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/digipet-v${VERSION}.apk"

      - name: 🚀 Publish GitHub Release with APK Assets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/digipet-latest.apk
            android/app/build/outputs/apk/debug/digipet-v*.apk
          tag_name: v${{ steps.prep_release.outputs.version }}
          name: DigiPet v${{ steps.prep_release.outputs.version }}
          body: |
            ## 🎮 DigiPet Companion v${{ steps.prep_release.outputs.version }}

            ### ✨ What's New:
            - **Elevated speech bubbles**: Positioned higher and layered behind Digimon heads in the floating companion overlay.
            - **Interactive Digimon AI dialogue engine**: Chat live with your companion powered by Gemini AI!
            - **Colosseum battle attack animations**: Dynamic lunges, screen shake, hit flashes, and floating damage numbers.
            - **GitHub Releases auto-updater backup**: Directly query and update from this repository.

            ### 📲 How to Install:
            1. Download `app-debug.apk` or `digipet-latest.apk` below on your Android phone.
            2. Open the file to install or update without losing your pet progress!
          draft: false
          prerelease: false
          make_latest: true
