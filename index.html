<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="module">
      import RefreshRuntime from "/@react-refresh";
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script>
      // Fallback preamble initialization
      window.__vite_plugin_react_preamble_installed__ = true;
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };

      // Suppress Vite HMR WebSocket connection errors in iframe preview environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && (event.reason || event.detail);
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('vite-hmr') !== -1 ||
          msg.indexOf('closed without opened') !== -1 ||
          msg.indexOf('SendBeforeConnectError') !== -1 ||
          msg.indexOf('send was called before connect') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('vite-hmr') !== -1 ||
          msg.indexOf('closed without opened') !== -1 ||
          msg.indexOf('SendBeforeConnectError') !== -1 ||
          msg.indexOf('send was called before connect') !== -1
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DigiPet: Virtual Screen Overlay Companion</title>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="DigiPet" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="DigiPet: Virtual Screen Overlay Companion" />
    <meta property="og:description" content="Hellopet-inspired Digimon virtual pet companion. Choose your DigiDestined egg, feed big meat, give vitamins, train, digivolve, customize your Digi-Room, and battle in the Digital Colosseum." />
    <meta property="og:type" content="website" />
