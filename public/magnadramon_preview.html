<!DOCTYPE html><html><body style="background:#000;color:#fff;">
<h2>Magnadramon Standing candidate (#19, #20)</h2>
<div style="display:flex;gap:10px;">
  <div style="width:92px;height:110px;overflow:hidden;position:relative;background:#222;">
    <img src="/assets/aistudio/Copy_of_Magnadramon_d8456cbf.png" style="position:absolute;left:-2px;top:-291px;" />
  </div>
  <div style="width:78px;height:110px;overflow:hidden;position:relative;background:#222;">
    <img src="/assets/aistudio/Copy_of_Magnadramon_d8456cbf.png" style="position:absolute;left:-96px;top:-291px;" />
  </div>
</div>
<h2>Animation</h2>
<div id="m_box" style="width:92px;height:110px;overflow:hidden;position:relative;background:#222;">
  <img id="m_img" src="/assets/aistudio/Copy_of_Magnadramon_d8456cbf.png" style="position:absolute;left:-2px;top:-291px;" />
</div>
<script>
const f = [{x:2,y:291,w:92,h:110},{x:96,y:291,w:78,h:110}];
let cur = 0;
setInterval(() => {
  cur = (cur + 1) % 2;
  const el = document.getElementById("m_img");
  el.style.left = -f[cur].x + "px";
  el.style.top = -f[cur].y + "px";
}, 300);
</script>
</body></html>
