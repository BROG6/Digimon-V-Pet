<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Walking Animation Review</title>
  <style>
    body { background: #1a1a24; color: #fff; font-family: monospace; padding: 20px; }
    h2 { color: #f59e0b; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .grid { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 30px; }
    .card { background: #262636; border: 1px solid #444; border-radius: 8px; padding: 12px; text-align: center; }
    .card img { image-rendering: pixelated; background: #333; border: 1px dashed #666; margin-bottom: 8px; }
    .preview-box { display: inline-block; width: 120px; height: 120px; background: #222; border: 2px solid #f59e0b; position: relative; overflow: hidden; margin-bottom: 10px; }
    .preview-box img { position: absolute; image-rendering: pixelated; }
    .anim-display { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; background: #262636; padding: 16px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Walking Animation Review</h1>

  <h2>WarGreymon (from uploaded Copy of WarGreymon_2.png)</h2>
  <div class="anim-display">
    <div>
      <div id="wg-anim" style="width: 80px; height: 80px; background: #111; border: 2px solid #10b981; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;">
        <img id="wg-img" style="image-rendering: pixelated; transform: scale(1.5);">
      </div>
      <div>WarGreymon Walk Cycle</div>
    </div>
    <div id="wg-info"></div>
  </div>

  <div class="grid" id="wg-cards"></div>

  <h2>MetalGreymon (from uploaded MetalGreymon.png / Copy_of_MetalGreymon_2)</h2>
  <div class="anim-display">
    <div>
      <div id="mg-anim" style="width: 120px; height: 120px; background: #111; border: 2px solid #3b82f6; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;">
        <img id="mg-img" style="image-rendering: pixelated; transform: scale(1.2);">
      </div>
      <div>MetalGreymon Walk Cycle</div>
    </div>
    <div id="mg-info"></div>
  </div>

  <div class="grid" id="mg-cards"></div>

  <script>
    // WarGreymon frames
    const wgFrames = [
      { id: 'walk_0', name: 'walk_0 (top-left)', src: '/debug_candidates/wargreymon2/walk_0.png', x: 2, y: 12, w: 74, h: 71 },
      { id: 'walk_1', name: 'walk_1 (top-mid)', src: '/debug_candidates/wargreymon2/walk_1.png', x: 83, y: 20, w: 72, h: 72 },
      { id: 'walk_2', name: 'walk_2 (top-right)', src: '/debug_candidates/wargreymon2/walk_2.png', x: 157, y: 20, w: 72, h: 72 },
      { id: 'walk_3', name: 'walk_3 (mid-left)', src: '/debug_candidates/wargreymon2/walk_3.png', x: 2, y: 85, w: 79, h: 71 },
      { id: 'walk_4', name: 'walk_4 (mid-mid)', src: '/debug_candidates/wargreymon2/walk_4.png', x: 84, y: 94, w: 73, h: 71 },
      { id: 'walk_5', name: 'walk_5 (mid-right)', src: '/debug_candidates/wargreymon2/walk_5.png', x: 159, y: 94, w: 73, h: 71 },
      { id: 'walk_6', name: 'walk_6 (bot-mid)', src: '/debug_candidates/wargreymon2/walk_6.png', x: 84, y: 167, w: 79, h: 71 },
      { id: 'walk_7', name: 'walk_7 (bot-right)', src: '/debug_candidates/wargreymon2/walk_7.png', x: 165, y: 167, w: 73, h: 71 },
      { id: 'stand_0', name: 'stand_0 (bot-left)', src: '/debug_candidates/wargreymon2/stand_0.png', x: 2, y: 158, w: 80, h: 80 }
    ];

    const wgContainer = document.getElementById('wg-cards');
    wgFrames.forEach(f => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${f.src}"><br><strong>${f.name}</strong><br><span>${f.w}x${f.h} at [${f.x}, ${f.y}]</span>`;
      wgContainer.appendChild(card);
    });

    // Animate WarGreymon
    const wgWalkCycle = wgFrames.filter(f => f.id.startsWith('walk_'));
    let wgIdx = 0;
    const wgImg = document.getElementById('wg-img');
    const wgInfo = document.getElementById('wg-info');
    setInterval(() => {
      const f = wgWalkCycle[wgIdx];
      wgImg.src = f.src;
      wgInfo.innerText = `Frame ${wgIdx + 1}/${wgWalkCycle.length}: ${f.id} (${f.w}x${f.h})`;
      wgIdx = (wgIdx + 1) % wgWalkCycle.length;
    }, 180);

    // MetalGreymon frames
    const mgComponents = [
      { id: 0, x: 350, y: 2, w: 90, h: 77, desc: "sleep" },
      { id: 1, x: 103, y: 49, w: 85, h: 96, desc: "swimming/diagonal" },
      { id: 2, x: 190, y: 49, w: 78, h: 96, desc: "swimming/diagonal" },
      { id: 3, x: 270, y: 53, w: 78, h: 92, desc: "swimming/diagonal" },
      { id: 4, x: 2, y: 58, w: 99, h: 87, desc: "fire/attack" },
      { id: 5, x: 350, y: 81, w: 90, h: 79, desc: "happy/cheer" },
      { id: 6, x: 2, y: 147, w: 109, h: 81, desc: "walk row A 1" },
      { id: 7, x: 113, y: 147, w: 92, h: 81, desc: "walk row A 2" },
      { id: 8, x: 207, y: 147, w: 93, h: 81, desc: "walk row A 3" },
      { id: 9, x: 395, y: 162, w: 77, h: 90, desc: "diagonal" },
      { id: 10, x: 302, y: 170, w: 91, h: 82, desc: "walk row A 4" },
      { id: 11, x: 2, y: 230, w: 112, h: 85, desc: "walk row B 1" },
      { id: 12, x: 116, y: 230, w: 96, h: 85, desc: "walk row B 2" },
      { id: 13, x: 218, y: 236, w: 79, h: 89, desc: "diagonal" },
      { id: 14, x: 350, y: 254, w: 92, h: 77, desc: "pose" },
      { id: 15, x: 2, y: 317, w: 113, h: 86, desc: "stand 1" },
      { id: 16, x: 119, y: 319, w: 97, h: 86, desc: "stand 2" },
      { id: 17, x: 233, y: 327, w: 103, h: 82, desc: "walk row C 1" },
      { id: 18, x: 345, y: 333, w: 102, h: 78, desc: "walk row C 2" },
      { id: 19, x: 2, y: 405, w: 115, h: 87, desc: "walk row D 1" },
      { id: 20, x: 119, y: 407, w: 112, h: 85, desc: "walk row D 2" },
      { id: 21, x: 233, y: 411, w: 110, h: 81, desc: "walk row D 3" },
      { id: 22, x: 345, y: 413, w: 106, h: 79, desc: "walk row D 4" }
    ];

    const mgContainer = document.getElementById('mg-cards');
    mgComponents.forEach(c => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="/debug_candidates/metalgreymon/mg_${c.id}.png"><br><strong>mg_${c.id}</strong><br><span>${c.w}x${c.h} at [${c.x}, ${c.y}]</span><br><small style="color:#aaa">${c.desc}</small>`;
      mgContainer.appendChild(card);
    });

    // Test multiple walking sequences
    const mgAllRows = [
      { name: "Row D (bottom ground)", frames: [19, 20, 21, 22] },
      { name: "Row C + D (6 frames)", frames: [17, 18, 19, 20, 21, 22] },
      { name: "Row A + B (stride)", frames: [6, 7, 8, 10, 11, 12] }
    ];
    let activeMgRow = 1;
    let mgIdx = 0;
    const mgImg = document.getElementById('mg-img');
    const mgInfo = document.getElementById('mg-info');
    setInterval(() => {
      const seq = mgAllRows[activeMgRow].frames.map(id => mgComponents.find(c => c.id === id));
      const f = seq[mgIdx % seq.length];
      mgImg.src = `/debug_candidates/metalgreymon/mg_${f.id}.png`;
      mgInfo.innerText = `${mgAllRows[activeMgRow].name} - Frame ${(mgIdx % seq.length) + 1}/${seq.length}: mg_${f.id} (${f.w}x${f.h})`;
      mgIdx = (mgIdx + 1) % seq.length;
    }, 180);
  </script>
</body>
</html>
